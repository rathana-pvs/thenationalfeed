# ── Rate Limiting ──────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=thenationalfeed_api:10m rate=10r/s;

# ── HTTP Server (Supports Cloudflare Flexible + Direct HTTPS) ──
server {
    listen 80;
    listen [::]:80;
    server_name thenationalfeed.com www.thenationalfeed.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to PM2 port 3002
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}

# ── HTTPS Main Server ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thenationalfeed.com www.thenationalfeed.com;

    # SSL certificates
    ssl_certificate     /etc/letsencrypt/live/thenationalfeed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thenationalfeed.com/privkey.pem;

    # SSL hardening (Cloudflare compatible)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_THENATIONALFEED:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 50M;

    # ── Serve uploaded media directly from disk ───────────────
    location /media/ {
        alias /var/www/thenationalfeed/public/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-CH "Sec-CH-Prefers-Color-Scheme";
        add_header Vary "Sec-CH-Prefers-Color-Scheme";
    }

    # ── Proxy to PM2 (Next.js & Payload on Port 3002) ────────
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # ── Rate limit the Payload CMS admin & API ───────────────
    location /api/ {
        limit_req zone=thenationalfeed_api burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Cache static Next.js assets aggressively ─────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        expires    365d;
        add_header Cache-Control "public, immutable";
    }
}
